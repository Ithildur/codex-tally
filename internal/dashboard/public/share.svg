<svg xmlns="http://www.w3.org/2000/svg" width="{{.Width}}" height="{{.Height}}" viewBox="0 0 {{.Width}} {{.Height}}" role="img" aria-labelledby="title desc" data-theme="{{.Theme}}">
  <title id="title">Codex · {{.Title}}</title>
  <desc id="desc">{{.Month}} 月度快照，更新于 {{.Updated}}{{if .Value}}，{{.Title}} {{.Value}}{{end}}</desc>
  <style>
    svg { color-scheme:dark; --bg:#111214; --text:#eeeff1; --muted:#a0a4ab; --line:#35383d; background:var(--bg); }
    svg[data-theme="light"] { color-scheme:light; --bg:#f8f9fb; --text:#20252d; --muted:#626b78; --line:#cdd2da; }
    @media(prefers-color-scheme:light) { svg[data-theme="auto"] { color-scheme:light; --bg:#f8f9fb; --text:#20252d; --muted:#626b78; --line:#cdd2da; } }
    text { fill:var(--text); font-family:Arial,"Noto Sans SC",sans-serif; font-size:15px; }
    .muted { fill:var(--muted); font-size:12px; } .value { font-family:monospace; font-size:48px; } .number { font-family:monospace; } .line { stroke:var(--line); }
  </style>
  <rect width="100%" height="100%" fill="var(--bg)"/>
  <text x="24" y="34">{{.Title}}</text><text x="95%" y="34" text-anchor="end" class="muted">Codex · {{.Month}}</text>
  <line x1="24" y1="50" x2="95%" y2="50" class="line"/>
  {{if eq .Component "overview"}}
    <text x="24" y="87" class="muted">总 Token</text><text x="24" y="145" class="value">{{compact .Tokens}}</text>
    <text x="24" y="198" class="muted">调用次数</text><text x="24" y="233" class="number" style="font-size:28px">{{.Calls}}</text>
    <text x="350" y="198" class="muted">缓存命中率</text><text x="350" y="233" class="number" style="font-size:28px">{{.CacheRate}}</text>
    <line x1="24" y1="255" x2="95%" y2="255" class="line"/>
  {{end}}
  {{if eq .Component "hub"}}
    {{range .Parts}}<g transform="translate({{.X}} {{.Y}})" data-component="{{.Key}}">
      {{if eq .Key "models"}}
        <text x="24" y="18" class="muted">{{.Title}}</text>
        {{range $.Rows}}<text x="24" y="{{.Y}}" class="number"><title>{{.Model}}</title>{{short .Model}}</text><text x="75%" y="{{.Y}}" text-anchor="end" class="number">{{compact .Tokens}}</text><text x="95%" y="{{.Y}}" text-anchor="end" class="muted">{{.Calls}} 次</text>{{else}}<text x="24" y="{{$.RowsY}}" class="muted">本月暂无记录</text>{{end}}
      {{else}}
        <text y="18" class="muted">{{.Title}}</text><text y="78" class="number" style="font-size:36px">{{.Value}}</text>
      {{end}}
    </g>{{end}}
  {{else if .Value}}<text x="24" y="117" class="value">{{.Value}}</text>{{else}}
    {{range .Rows}}<text x="24" y="{{.Y}}" class="number"><title>{{.Model}}</title>{{short .Model}}</text><text x="75%" y="{{.Y}}" text-anchor="end" class="number">{{compact .Tokens}}</text><text x="95%" y="{{.Y}}" text-anchor="end" class="muted">{{.Calls}} 次</text>{{else}}<text x="24" y="{{.RowsY}}" class="muted">本月暂无记录</text>{{end}}
  {{end}}
  <text x="24" y="95%" class="muted">更新于 {{.Updated}}</text>
</svg>
