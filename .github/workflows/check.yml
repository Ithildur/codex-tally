name: Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check scripts
        shell: bash
        run: |
          for file in internal/dashboard/public/*.js scripts/*.mjs; do
            node --check "$file"
          done
          python -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/package.py').read_text(encoding='utf-8'))"
