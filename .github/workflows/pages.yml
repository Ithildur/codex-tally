name: Check and deploy Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      ready: ${{ steps.snapshot.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Find public snapshot
        id: snapshot
        run: |
          if [ -f site/usage.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Export and commit site/usage.json to enable deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@v7
        if: steps.snapshot.outputs.ready == 'true'
        with:
          go-version-file: go.mod
      - name: Build public files only
        if: steps.snapshot.outputs.ready == 'true'
        run: go run ./cmd/codex-dashboard build-pages -input site/usage.json -out _site
      - uses: actions/configure-pages@v5
        if: steps.snapshot.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.snapshot.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
